# La política de contenido va solo en el HTML. Fuera del propio sitio solo se permite lo que la app
# usa: la API de AniList, sus imágenes, las miniaturas de YouTube y el reproductor de tráileres.
map $sent_http_content_type $csp {
    default "";
    ~text/html "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://s4.anilist.co https://i.ytimg.com; font-src 'self'; connect-src 'self' https://graphql.anilist.co; frame-src https://www.youtube-nocookie.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# El HTML se revalida siempre; los /assets/ llevan hash en el nombre y se guardan un año.
map $sent_http_content_type $cache_html {
    default "";
    ~text/html "public, max-age=0, must-revalidate";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_vary on;

    # add_header no se hereda: si un location declara uno propio, pierde todos estos.
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control $cache_html always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # El manifiesto de la app instalable. Un `types` a nivel de server reemplazaría la tabla entera de
    # tipos (el HTML saldría como descarga), así que va solo aquí.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
